name: Publish PyPI
on:
  push:
    branches: [main]
    paths:
      - 'python/.pypi-release-trigger-0.1.0'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-pypi to confirm'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.event_name == 'push' || inputs.confirm == 'publish-pypi'
    runs-on: ubuntu-latest
    environment: pypi-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build twine
      - run: python -m build python --outdir python/dist
      - run: python -m twine check python/dist/*
      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
