name: Publish npm
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-npm to confirm'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-npm.yml'
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.event_name == 'push' || inputs.confirm == 'publish-npm'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm --version
      - run: npm test
      - run: npm stage publish
