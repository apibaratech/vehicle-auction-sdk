name: Publish npm
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type stage-npm to confirm staging a release for 2FA approval'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: inputs.confirm == 'stage-npm'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm --version
      - run: npm test
      - run: npm stage publish
