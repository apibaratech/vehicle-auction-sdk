[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apibara-vehicle-auction"
version = "0.1.0"
description = "Official Python SDK for the Apibara.tech Vehicle Auction Data API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Apibara.tech"}]
keywords = ["apibara", "copart", "iaai", "vehicle auction", "api"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://apibara.tech"
Documentation = "https://apibara.tech/en/products/vehicle-auction-data-api/docs"
Repository = "https://github.com/apibaratech/vehicle-auction-sdk"
Issues = "https://github.com/apibaratech/vehicle-auction-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
